# Alert rules for AttendFlow. Each rule has a `for:` duration so that short
# blips do not page. Severity labels drive routing in alertmanager.yml:
#   critical -> page-level receiver, warning -> ticket-level receiver,
#   none     -> Watchdog heartbeat, dropped by the null receiver.
groups:
  - name: platform
    rules:
      # Always firing. Confirms the Prometheus -> Alertmanager path works.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: Always firing. Confirms the alerting pipeline is working.

      # A scrape target has been unreachable for 2 minutes. The backend is not
      # listed here because it pushes metrics; see BackendNoTraffic below.
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} ({{ $labels.instance }}) is down"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for 2 minutes."

  - name: backend-api
    rules:
      # More than 5% of backend requests returned 5xx over 5 minutes. The rate
      # floor avoids alerting on one failed request during quiet periods.
      - alert: BackendHighErrorRate
        expr: |
          (
            sum(rate(http_server_request_duration_seconds_count{job="attendflow-backend", http_response_status_code=~"5.."}[5m]))
            /
            sum(rate(http_server_request_duration_seconds_count{job="attendflow-backend"}[5m]))
          ) > 0.05
          and
          sum(rate(http_server_request_duration_seconds_count{job="attendflow-backend"}[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backend 5xx error rate above 5%"
          description: "{{ $value | humanizePercentage }} of backend requests returned 5xx over the last 5 minutes."

      # p95 request latency above 1 second for 10 minutes.
      - alert: BackendHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_request_duration_seconds_bucket{job="attendflow-backend"}[5m]))
          ) > 1
          and
          sum(rate(http_server_request_duration_seconds_count{job="attendflow-backend"}[5m])) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend p95 latency above 1s"
          description: "p95 request latency is {{ $value | humanizeDuration }}."

  - name: host-and-containers
    rules:
      # Available memory below 10% of total for 10 minutes. This reads the
      # Docker Desktop Linux VM on macOS, not the macOS host.
      - alert: HostMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory above 90%"
          description: "Memory usage is {{ $value | humanizePercentage }}."

      # Less than 10% free on a real disk for 15 minutes. tmpfs and FUSE mounts
      # are excluded because they do not represent disk capacity.
      - alert: HostDiskLow
        expr: |
          (node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"}
            / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"}) < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} below 10% free"
          description: "Only {{ $value | humanizePercentage }} of disk space remains on {{ $labels.instance }}."

      # A Compose container is using more than 90% of its memory limit. Containers
      # without a limit (spec value 0) are skipped.
      - alert: ContainerMemoryNearLimit
        expr: |
          max by (container_label_com_docker_compose_service) (
            container_memory_usage_bytes{container_label_com_docker_compose_service!=""}
          )
          /
          max by (container_label_com_docker_compose_service) (
            container_spec_memory_limit_bytes{container_label_com_docker_compose_service!=""} > 0
          ) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.container_label_com_docker_compose_service }} is near its memory limit"
          description: "Memory use is {{ $value | humanizePercentage }} of its configured limit."

  - name: database
    rules:
      # pg_up is 0 when postgres-exporter cannot query PostgreSQL.
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unreachable from postgres-exporter"
          description: "postgres-exporter has reported pg_up=0 for 2 minutes. Check the attendflow-postgres container and the monitor role."

      # More than 80% of max_connections in use for 5 minutes.
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above 80% of max_connections"
          description: "{{ $value | humanizePercentage }} of connection slots are in use."

  - name: telemetry-pipeline
    rules:
      # The backend pushes metrics over OTLP, so it has no `up` series. The OTel
      # SDK exports cumulative series, so this series persists while the backend
      # runs, even when idle. It disappears only when the backend or its export
      # path has failed.
      - alert: BackendNoTraffic
        expr: absent_over_time(http_server_request_duration_seconds_count{job="attendflow-backend"}[15m])
        labels:
          severity: warning
        annotations:
          summary: "No backend telemetry received for 15 minutes"
          description: "Either the backend is down, its OTLP export is broken, or it has had no requests. Check the attendflow-backend container and the collector logs."
