# Loads dashboard JSON files from /var/lib/grafana/dashboards (mounted from config/grafana/dashboards).
# allowUiUpdates is false so dashboards stay under version control.
apiVersion: 1

providers:
  - name: attendflow
    orgId: 1
    folder: AttendFlow
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
