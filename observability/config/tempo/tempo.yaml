# Tempo single-binary configuration with local block storage.
# Receives OTLP traces from the OTel Collector on :4317 and serves queries on :3200.
# Retention uses the Tempo 3.x default (336h / 14 days). Tempo 3.x no longer reads
# a top-level compactor block for this setting.
server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
