# AttendFlow observability stack.
# Start the app stack first: docker-compose.yml in the repo root creates attendflow-net.
name: attendflow-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: attendflow-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - attendflow-net
      - observability-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: attendflow-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  loki:
    image: grafana/loki:3.7.10
    container_name: attendflow-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  tempo:
    image: grafana/tempo:3.1.1
    container_name: attendflow-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  alertmanager:
    image: prom/alertmanager:v0.35.0
    container_name: attendflow-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      alert-sink:
        condition: service_healthy
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Private webhook receiver for Alertmanager. It is not published to the host.
  # Alerts are printed to its logs and kept in memory for GET /alerts (see alert_sink.py).
  # Replace it with Slack or email receivers when credentials are available.
  alert-sink:
    image: python:3.12-alpine3.22
    container_name: attendflow-alert-sink
    command: ["python", "-u", "/app/alert_sink.py"]
    volumes:
      - ./config/alert-sink/alert_sink.py:/app/alert_sink.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 96M

  grafana:
    image: grafana/grafana:13.2.6
    container_name: attendflow-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in observability/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Container metrics for every Compose service (CPU, memory, network), labelled by service name.
  # Runs read-only against the Docker Desktop Linux VM; it cannot see the macOS host itself.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.0
    container_name: attendflow-cadvisor
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --containerd=/var/run/docker/containerd/containerd.sock
      - --containerd-namespace=moby
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # Host metrics (CPU, memory, disk, network). Reads the Docker Desktop Linux VM on macOS.
  # pid: host and the read-only root mount let it read host-level /proc and /sys data.
  node-exporter:
    image: prom/node-exporter:v1.12.1-busybox
    container_name: attendflow-node-exporter
    command:
      - --path.rootfs=/rootfs
    pid: host
    volumes:
      - /:/rootfs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # PostgreSQL metrics. Connects as the read-only attendflow_monitor role (pg_monitor only).
  # The user and password are supplied separately so the password never appears in the DSN.
  # DATA_SOURCE_NAME ignores DATA_SOURCE_PASS, so the host/port/options come from DATA_SOURCE_URI.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: attendflow-postgres-exporter
    environment:
      DATA_SOURCE_URI: "postgres:5432/postgres?sslmode=disable"
      DATA_SOURCE_USER: attendflow_monitor
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?Set POSTGRES_EXPORTER_PASSWORD in observability/.env}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - attendflow-net
      - observability-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  attendflow-net:
    external: true
  observability-net:

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  alertmanager_data:
  grafana_data:
