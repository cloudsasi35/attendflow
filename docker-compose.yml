services:
  postgres:
    image: postgres:15.20-alpine
    container_name: attendflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "-U postgres"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - attendflow-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendflow-backend
    environment:
      DATABASE_URL: postgresql+psycopg://attendflow:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@postgres:5432/attendflow
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      APP_ENV: development
      DEBUG: "true"
      SEED_DEMO_DATA: "true"
      LOG_LEVEL: INFO
      # Telemetry goes to the OpenTelemetry Collector in the observability stack.
      # The backend starts without it; exports are dropped until the collector is up.
      OTEL_SERVICE_NAME: attendflow-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SEMCONV_STABILITY_OPT_IN: http
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - attendflow-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    command: sh -c "python -m attendflow.scripts && uvicorn attendflow.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendflow-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_TELEMETRY_ENABLED: ${VITE_TELEMETRY_ENABLED:-true}
    networks:
      - attendflow-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  attendflow-net:
    name: attendflow-net
