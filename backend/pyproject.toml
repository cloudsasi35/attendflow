[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attendflow"
version = "0.1.0"
description = "Employee Attendance & Leave Management SaaS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0,<2.1",
    "alembic>=1.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.6",
    "pytz>=2023.3",
    # OpenTelemetry: pinned together because the instrumentation packages must match.
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
    "opentelemetry-instrumentation-logging==0.66b2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "faker>=20.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "faker>=20.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]
